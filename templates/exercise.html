<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Video Stream | AI Fitness Trainer</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            font-family: 'Poppins', sans-serif;
            text-align: center;
        }

        .container {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .video-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 1200px;
            width: 100%;
            gap: 30px;
        }

        .video-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            flex: 2;
            max-width: 800px;
            border: 4px solid #ffcc00;
            position: relative;
        }

        .video-container img {
            border-radius: 10px;
            width: 100%;
            height: auto;
        }

        .controls-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #timer {
            font-size: 2rem;
            font-weight: bold;
            color: #ffcc00;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
            display: inline-block;
        }

        .btn {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 30px;
            transition: all 0.3s ease-in-out;
            border: none;
            min-width: 180px;
            text-align: center;
        }

        .btn-start {
            background: linear-gradient(135deg, #00ff99, #007bff);
            color: white;
        }

        .btn-pause {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: black;
        }

        .btn-stop {
            background: linear-gradient(135deg, #ff1e56, #ff5733);
            color: white;
        }

        .popup {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            z-index: 1000;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎥 Live Video Streaming</h1>
        
        <div class="video-wrapper">
            <div class="video-container">
              <!-- <img id="videoStream" src="{{ url_for('video_feed') }}" alt="Live Video Stream">--> 
              <img id="videoStream" src="{{ url_for('video_feed') }}" width="700" height="500">

                <div id="popup" class="popup">⏳ Time is Over! Restarting...</div>
            </div>

            <div class="controls-container">
                <div class="timer-container">
                    <label for="timerSelect" class="form-label">⏳ Set Timer:</label>
                    <select id="timerSelect" class="form-select">
                        <option value="180">3 Minutes</option>
                        <option value="300">5 Minutes</option>
                        <option value="600">10 Minutes</option>
                    </select>
                    <div id="timer">00:00</div>
                </div>

                <button class="btn btn-start" onclick="startStream()">▶ Start</button>
                <button class="btn btn-pause" onclick="pauseStream()">⏸ Pause</button>
                <button class="btn btn-stop" onclick="stopStream()">⏹ Stop</button>
            </div>
        </div>
    </div>

    <script>
        let timerInterval;
        let timeLeft = 0;
        let running = false;

        function startStream() {
            let video = document.getElementById("videoStream");
            let timerDisplay = document.getElementById("timer");
            let timerSelect = document.getElementById("timerSelect");
            let popup = document.getElementById("popup");

            popup.style.display = "none";  // Hide popup if previously shown

            if (!running) {
                timeLeft = parseInt(timerSelect.value);
                timerDisplay.textContent = formatTime(timeLeft);
            }
            running = true;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showPopup();
                } else {
                    timeLeft--;
                    timerDisplay.textContent = formatTime(timeLeft);
                }
            }, 1000);

            video.src = "{{ url_for('video_feed') }}";
        }

        function pauseStream() {
            running = false;
            clearInterval(timerInterval);
        }

        function stopStream() {
            running = false;
            clearInterval(timerInterval);
            document.getElementById("timer").textContent = "00:00";
        }

        function showPopup() {
            let popup = document.getElementById("popup");
            popup.style.display = "block";
            
            setTimeout(() => {
                popup.style.display = "none";
                startStream();  // Automatically restart the timer & video after 3 seconds
            }, 3000);
        }

        function formatTime(seconds) {
            let minutes = Math.floor(seconds / 60);
            let secs = seconds % 60;
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>

</body>
</html>
